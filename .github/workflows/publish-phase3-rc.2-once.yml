name: Publish PlexonShops 3.0.0-rc.2 once

on:
  push:
    branches:
      - phase3/release-v3.0.0-rc.2
    paths:
      - '.github/workflows/publish-phase3-rc.2-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prove accepted Phase 3 ancestry and release-only delta
        run: |
          set -euo pipefail
          ACCEPTED=aed5c49ae3cddb54ad2e456a49bf7ce5e67ad673
          git merge-base --is-ancestor "$ACCEPTED" HEAD
          git diff --name-only "$ACCEPTED" HEAD | tee /tmp/release-delta.txt
          if grep -Ev '^(build\.gradle\.kts|\.github/workflows/build\.yml|\.github/workflows/publish-phase3-rc\.2-once\.yml|\.release/RELEASE_NOTES_3\.0\.0-rc\.2\.md)$' /tmp/release-delta.txt | grep -q .; then
            echo 'Non-release-only file changed after accepted Phase 3 SHA.' >&2
            exit 1
          fi
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Full release-candidate verification
        run: ./gradlew --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace
      - name: Produce release evidence
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')
          test "$VERSION" = "3.0.0-rc.2"
          JAR="build/libs/PlexonShops-${VERSION}.jar"
          test -s "$JAR"
          mkdir -p build/release
          jar tf "$JAR" > build/release/JAR_CONTENTS.txt
          for prefix in 'com/zpkdxgames/plexoncore/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/' 'org/bukkit/' 'io/papermc/paper/' 'net/kyori/adventure/' 'net/luckperms/api/'; do
            if grep -q "^${prefix}" build/release/JAR_CONTENTS.txt; then echo "Forbidden provided API shaded: $prefix" >&2; exit 1; fi
          done
          unzip -p "$JAR" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d " '\"\r" | grep -qx "$VERSION"
          javap -verbose -classpath "$JAR" com.plexon.shops.PlexonShops | grep -q 'major version: 69'
          grep -F 'io.papermc.paper:paper-api:26.2.build.121-stable' build.gradle.kts
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('build/test-results/test/TEST-*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          if t <= 17 or f or e or s: raise SystemExit(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          open('build/release/TEST_SUMMARY.txt','w').write(f'executed={t}\nfailures={f}\nerrors={e}\nskipped={s}\n')
          print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          (cd build/libs && sha256sum "PlexonShops-${VERSION}.jar" > ../release/SHA256SUMS.txt)
          (cd build/libs && sha256sum --check ../release/SHA256SUMS.txt)
          cat > build/release/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonShops
          commit=${GITHUB_SHA}
          accepted_phase3=aed5c49ae3cddb54ad2e456a49bf7ce5e67ad673
          version=${VERSION}
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=2.0.4
          runtime_certification=NOT_EXECUTED
          EOF
      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v3.0.0-rc.2
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 && { echo "$TAG already exists" >&2; exit 1; } || true
          gh release view "$TAG" >/dev/null 2>&1 && { echo "$TAG release already exists" >&2; exit 1; } || true
          gh release create "$TAG" build/libs/PlexonShops-3.0.0-rc.2.jar build/release/SHA256SUMS.txt build/release/TEST_SUMMARY.txt build/release/PROVENANCE.txt --target "$GITHUB_SHA" --prerelease --title 'PlexonShops 3.0.0-rc.2' --notes-file .release/RELEASE_NOTES_3.0.0-rc.2.md
