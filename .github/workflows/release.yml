name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.3.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Provision PlexonCore 2.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.0/PlexonCore-2.0.0.jar"
          echo "179b82ce7fd82e3095b3a6d0d893af6d7c97f91bd7ce403e96d7f3581462dfec  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify and package
        run: ./gradlew --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')
          EXPECTED_TAG="v${VERSION}"
          RELEASE_TAG="${REQUESTED_TAG:-$EXPECTED_TAG}"
          JAR="build/libs/PlexonShops-${VERSION}.jar"
          CHECKSUM="build/release/SHA256SUMS.txt"
          NOTES="releases/${VERSION}.md"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match project version $VERSION"
            exit 1
          fi

          mkdir -p build/release
          (
            cd build/libs
            sha256sum "PlexonShops-${VERSION}.jar" > ../release/SHA256SUMS.txt
            sha256sum --check ../release/SHA256SUMS.txt
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Stable release $RELEASE_TAG already exists; immutable release assets will not be overwritten." >&2
            exit 1
          fi

          args=("$RELEASE_TAG" "$JAR" "$CHECKSUM" --target "$GITHUB_SHA" --title "PlexonShops ${VERSION}")
          if [ -s "$NOTES" ]; then
            args+=(--notes-file "$NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "${args[@]}"
