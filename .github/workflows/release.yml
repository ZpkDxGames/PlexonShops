name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify and package
        run: ./gradlew --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')
          EXPECTED_TAG="v${VERSION}"
          RELEASE_TAG="${REQUESTED_TAG:-$EXPECTED_TAG}"
          JAR="build/libs/PlexonShops-${VERSION}.jar"
          CHECKSUM="build/release/SHA256SUMS.txt"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match project version $VERSION"
            exit 1
          fi

          mkdir -p build/release
          (cd "$(dirname "$JAR")" && sha256sum "$(basename "$JAR")") > "$CHECKSUM"
          sha256sum --check "$CHECKSUM" --ignore-missing

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$JAR" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" "$JAR" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "PlexonShops ${VERSION}" \
              --generate-notes
          fi
