          cat > src/test/java/com/plexon/shops/storage/SqliteFutureSchemaTest.java <<'EOF'
          package com.plexon.shops.storage;

          import com.plexon.shops.config.PluginConfig;
          import com.plexon.shops.util.BoundedExecutor;
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.io.TempDir;

          import java.nio.file.Path;
          import java.sql.DriverManager;
          import java.time.Duration;
          import java.util.concurrent.ExecutionException;
          import java.util.concurrent.TimeUnit;
          import java.util.logging.Logger;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertThrows;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          class SqliteFutureSchemaTest {
              @TempDir
              Path temporaryDirectory;

              @Test
              void futureSchemaFailsClosedWithoutDowngradingMarker() throws Exception {
                  Path database = temporaryDirectory.resolve("future.db");
                  Class.forName("org.sqlite.JDBC");
                  try (var connection = DriverManager.getConnection("jdbc:sqlite:" + database);
                       var statement = connection.createStatement()) {
                      statement.execute("CREATE TABLE plexonshops_schema (id INTEGER PRIMARY KEY, schema_version INTEGER NOT NULL, updated_at INTEGER NOT NULL)");
                      statement.execute("INSERT INTO plexonshops_schema VALUES (1, 99, 1)");
                  }

                  BoundedExecutor worker = new BoundedExecutor("future-schema-test", 1, 32);
                  SqliteShopRepository repository = new SqliteShopRepository(
                          database.toFile(), new PluginConfig.Database("future.db", 1, 5_000L),
                          worker, Logger.getAnonymousLogger());
                  try {
                      ExecutionException error = assertThrows(ExecutionException.class,
                              () -> repository.initialize().get(10, TimeUnit.SECONDS));
                      assertTrue(error.getCause().getMessage().contains("Could not initialize"));
                      assertEquals("migration-failed", repository.diagnostics().migrationStatus());
                      assertEquals(99, repository.diagnostics().schemaVersion());
                      try (var connection = DriverManager.getConnection("jdbc:sqlite:" + database);
                           var query = connection.createStatement().executeQuery(
                                   "SELECT schema_version FROM plexonshops_schema WHERE id = 1")) {
                          assertTrue(query.next());
                          assertEquals(99, query.getInt(1));
                      }
                  } finally {
                      worker.shutdown(Duration.ofSeconds(5));
                  }
              }
          }
          EOF

