              void concurrentPreloadsShareOneDatabaseRead() {
                  FakeRepository repository = new FakeRepository();
                  DiscoveryService service = new DiscoveryService(repository, null, Logger.getAnonymousLogger());
                  UUID player = UUID.randomUUID();
                  CompletableFuture<Void> first = service.preload(player);
                  CompletableFuture<Void> second = service.preload(player);
                  assertSame(first, second);
                  assertEquals(1, repository.loadCalls);
              }

              @Test
              void ordinaryLoadInstallsImmutablePlayerSnapshot() throws Exception {
                  FakeRepository repository = new FakeRepository();
                  DiscoveryService service = new DiscoveryService(repository, null, Logger.getAnonymousLogger());
                  UUID player = UUID.randomUUID();
                  UUID favorite = UUID.randomUUID();
                  CompletableFuture<Void> load = service.preload(player);
                  repository.load.complete(new PlayerDiscoveryData(Set.of(favorite), List.of()));
                  load.get(2, TimeUnit.SECONDS);
                  assertTrue(service.isLoaded(player));
                  assertTrue(service.isFavorite(player, favorite));
              }

              @Test
              void playerMutationRejectsOlderAsyncLoadResult() throws Exception {
                  FakeRepository repository = new FakeRepository();
                  DiscoveryService service = new DiscoveryService(repository, null, Logger.getAnonymousLogger());
                  UUID player = UUID.randomUUID();
                  UUID staleFavorite = UUID.randomUUID();
                  CompletableFuture<Void> load = service.preload(player);
                  service.recordVisit(player, UUID.randomUUID()).get(2, TimeUnit.SECONDS);
                  repository.load.complete(new PlayerDiscoveryData(Set.of(staleFavorite), List.of()));
                  load.get(2, TimeUnit.SECONDS);
                  assertFalse(service.isLoaded(player));
                  assertFalse(service.isFavorite(player, staleFavorite));
              }

              @Test
              void shopDeletionRejectsOlderAsyncLoadResult() throws Exception {
                  FakeRepository repository = new FakeRepository();
                  DiscoveryService service = new DiscoveryService(repository, null, Logger.getAnonymousLogger());
                  UUID player = UUID.randomUUID();
                  UUID deleted = UUID.randomUUID();
                  CompletableFuture<Void> load = service.preload(player);
                  service.onShopDeleted(deleted);
                  repository.load.complete(new PlayerDiscoveryData(Set.of(deleted), List.of(deleted)));
                  load.get(2, TimeUnit.SECONDS);
                  assertFalse(service.isLoaded(player));
                  assertEquals(0, service.favoriteCount(player));
              }

              private static final class FakeRepository implements ShopRepository {
                  private final CompletableFuture<PlayerDiscoveryData> load = new CompletableFuture<>();
                  private int loadCalls;
                  private static CompletableFuture<Void> done() { return CompletableFuture.completedFuture(null); }
                  @Override public CompletableFuture<Void> initialize() { return done(); }
                  @Override public CompletableFuture<List<Shop>> loadAll() { return CompletableFuture.completedFuture(List.of()); }
                  @Override public CompletableFuture<Void> save(Shop shop) { return done(); }
                  @Override public CompletableFuture<Void> saveCore(Shop shop) { return done(); }
                  @Override public CompletableFuture<Void> touchOwner(UUID ownerUuid, String ownerName, long timestamp) { return done(); }
                  @Override public CompletableFuture<Void> saveRating(UUID shopId, Rating rating) { return done(); }
                  @Override public CompletableFuture<Void> recordVisits(Shop shop, List<Visitor> visitors) { return done(); }
                  @Override public CompletableFuture<Void> syncLabeledItems(Shop shop) { return done(); }
                  @Override public CompletableFuture<Set<UUID>> loadFeatured() { return CompletableFuture.completedFuture(Set.of()); }
                  @Override public CompletableFuture<PlayerDiscoveryData> loadDiscovery(UUID playerUuid, int recentLimit) { loadCalls++; return load; }
                  @Override public CompletableFuture<Void> setFavorite(UUID playerUuid, UUID shopId, boolean favorite, long timestamp) { return done(); }
                  @Override public CompletableFuture<Void> setFeatured(UUID shopId, boolean featured, long timestamp) { return done(); }
                  @Override public CompletableFuture<Void> recordRecentVisit(UUID playerUuid, UUID shopId, long timestamp, int recentLimit) { return done(); }
                  @Override public StorageDiagnostics diagnostics() { return new StorageDiagnostics(3, "test", "", 0); }
                  @Override public CompletableFuture<Void> delete(UUID shopId) { return done(); }
                  @Override public CompletableFuture<Void> close() { return done(); }
              }
          }
