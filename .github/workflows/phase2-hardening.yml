          cat > docs/MIGRATION_2.2.1_TO_3.0.0.md <<'EOF'
          # PlexonShops 2.2.1 → 3.0.0 Migration

          `3.0.0-rc.1` is an additive Phase 2 release candidate. Stable promotion is forbidden until PlexonCraft runtime certification passes.

          ## Preserved authoritative data

          The migration preserves the existing shop UUID, owner UUID, owner display name, shop name, destination, category/status, ratings, visitor counters, unique visitors, showcased items and Phase 1 teleport/economy semantics. Owner names remain display metadata; ownership remains UUID-based.

          Schema v3 adds discovery metadata for featured shops, per-player favorites and bounded recent successful visits. Existing shop identity is not regenerated.

          ## Upgrade boundary

          1. Stop Paper cleanly.
          2. Back up the complete `plugins/PlexonShops/` directory, including the SQLite database and any `-wal` / `-shm` sidecars.
          3. Keep the exact `v2.2.1` JAR available for rollback.
          4. Install `PlexonShops-3.0.0-rc.1.jar` on staging first.
          5. Keep PlexonCore 2.0.4 and the existing Vault/Theosis economy provider available.

          On first startup, an existing pre-v3 database is copied before migration. Schema creation is additive and idempotent. A database advertising a schema newer than this build supports is rejected without rewriting its schema marker. Malformed shop rows are diagnosed and retained rather than silently deleted.

          ## Runtime checks

          Validate discovery, profiles, owner management, OPEN/CLOSED enforcement, successful paid teleport, movement/damage/logout cancellation, shop closure during warmup, invalid destinations, refunds, exact one-visit commit, favorites/recent history, restart reconstruction, reload rollback, PAPI/API events and Core integration.

          ## Rollback

          If staging certification fails, stop Paper and restore the complete pre-upgrade data-directory backup plus the exact `v2.2.1` JAR (`81c77e936194de2d46fd40221ea57a1f65c07b34`). Do not attempt an in-place downgrade over a partially investigated v3 database when the clean backup is available.
          EOF

