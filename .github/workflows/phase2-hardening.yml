                    test "$(jq -r '.[0].head.sha' verify/prs.json)" = "$CANDIDATE_SHA"
                    stable_release=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$api/releases/tags/v3.0.0")
                    stable_tag=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$api/git/ref/tags/v3.0.0")
                    test "$stable_release" = '404'
                    test "$stable_tag" = '404'
                    echo "published_jar_size=${published_size}"
                    echo "published_jar_sha256=${published_sha}"
                    cat verify/TEST_SUMMARY.txt
                    cat verify/PROVENANCE.txt
                    echo 'post_publication_verification=SUCCESS'
          EOF

      - name: Run full hardened candidate verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace
          git diff --check origin/main...HEAD
      - name: Commit verified hardening patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase2-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden Phase 2 transaction and migration boundaries [phase2-hardened]'
          git push origin HEAD:phase2/3.0.0-premium-discovery
