          package com.plexon.shops.config;

          import org.bukkit.configuration.file.YamlConfiguration;
          import org.junit.jupiter.api.Test;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertThrows;

          class PluginConfigValidationTest {
              @Test void rejectsParentTraversalDatabasePath() {
                  YamlConfiguration yaml = base(); yaml.set("database.file", "../shops.db");
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void rejectsNegativeTeleportFee() {
                  YamlConfiguration yaml = base(); yaml.set("defaults.teleport-fee", -1.0D);
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void rejectsFeeAboveConfiguredMaximum() {
                  YamlConfiguration yaml = base(); yaml.set("defaults.teleport-fee", 11.0D); yaml.set("teleport.maximum-owner-fee", 10.0D);
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void rejectsExcessiveWarmup() {
                  YamlConfiguration yaml = base(); yaml.set("teleport.warmup-seconds", 301);
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void rejectsInvalidBossbarColor() {
                  YamlConfiguration yaml = base(); yaml.set("teleport.bossbar.color", "OCTARINE");
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void rejectsInvalidGuiSize() {
                  YamlConfiguration yaml = base(); yaml.set("guis.test.size", 10);
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void rejectsOverlappingGuiSlots() {
                  YamlConfiguration yaml = base(); yaml.set("guis.test.size", 27); yaml.set("guis.test.content-slots", java.util.List.of(1)); yaml.set("guis.test.slots.back", 1);
                  assertThrows(IllegalArgumentException.class, () -> PluginConfig.from(yaml));
              }
              @Test void acceptsBoundedCandidateAndNormalizesBlacklist() {
                  YamlConfiguration yaml = base(); yaml.set("blacklisted-worlds", java.util.List.of("Survival_Nether"));
                  PluginConfig config = PluginConfig.from(yaml);
                  assertEquals(2, config.worker().threads());
                  assertEquals(true, config.isWorldBlacklisted("SURVIVAL_NETHER"));
              }
              private static YamlConfiguration base() {
                  YamlConfiguration yaml = new YamlConfiguration();
                  yaml.set("database.file", "shops.db");
                  return yaml;
              }
          }
