          package com.plexon.shops.services;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Objects;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ConcurrentMap;

          /** Atomic per-player guard for the irreversible charge/teleport/visit boundary. */
          public final class TeleportAttemptRegistry<T> {
              private final ConcurrentMap<UUID, T> active = new ConcurrentHashMap<>();

              public boolean begin(UUID playerUuid, T attempt) {
                  Objects.requireNonNull(playerUuid, "playerUuid");
                  Objects.requireNonNull(attempt, "attempt");
                  return active.putIfAbsent(playerUuid, attempt) == null;
              }

              public boolean contains(UUID playerUuid) {
                  return active.containsKey(playerUuid);
              }

              public boolean complete(UUID playerUuid, T attempt) {
                  return active.remove(playerUuid, attempt);
              }

              public T cancel(UUID playerUuid) {
                  return active.remove(playerUuid);
              }

              public List<T> drain() {
                  List<T> removed = new ArrayList<>();
                  for (var entry : active.entrySet()) {
                      if (active.remove(entry.getKey(), entry.getValue())) {
                          removed.add(entry.getValue());
                      }
                  }
                  return List.copyOf(removed);
              }

              public int size() {
                  return active.size();
              }
          }
          EOF

          cat > src/test/java/com/plexon/shops/services/TeleportAttemptRegistryTest.java <<'EOF'
          package com.plexon.shops.services;

          import org.junit.jupiter.api.Test;

          import java.util.UUID;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertNull;
          import static org.junit.jupiter.api.Assertions.assertSame;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          class TeleportAttemptRegistryTest {
              @Test
              void onePlayerCannotBeginTwoIrreversibleAttempts() {
                  TeleportAttemptRegistry<Object> registry = new TeleportAttemptRegistry<>();
                  UUID player = UUID.randomUUID();
                  Object first = new Object();
                  assertTrue(registry.begin(player, first));
                  assertFalse(registry.begin(player, new Object()));
                  assertEquals(1, registry.size());
              }

              @Test
              void callbackMustMatchTheActiveAttemptToCommitOnce() {
                  TeleportAttemptRegistry<Object> registry = new TeleportAttemptRegistry<>();
                  UUID player = UUID.randomUUID();
                  Object token = new Object();
                  registry.begin(player, token);
                  assertFalse(registry.complete(player, new Object()));
                  assertTrue(registry.complete(player, token));
                  assertFalse(registry.complete(player, token));
              }

              @Test
              void cancelReturnsTheExactAttemptAndPreventsLateCommit() {
                  TeleportAttemptRegistry<Object> registry = new TeleportAttemptRegistry<>();
                  UUID player = UUID.randomUUID();
                  Object token = new Object();
                  registry.begin(player, token);
                  assertSame(token, registry.cancel(player));
                  assertFalse(registry.complete(player, token));
                  assertNull(registry.cancel(player));
              }

              @Test
              void differentPlayersRemainIndependent() {
                  TeleportAttemptRegistry<Object> registry = new TeleportAttemptRegistry<>();
                  assertTrue(registry.begin(UUID.randomUUID(), new Object()));
                  assertTrue(registry.begin(UUID.randomUUID(), new Object()));
                  assertEquals(2, registry.size());
              }

              @Test
              void drainIsSingleUseAndClearsShutdownBoundary() {
                  TeleportAttemptRegistry<Object> registry = new TeleportAttemptRegistry<>();
                  registry.begin(UUID.randomUUID(), new Object());
                  registry.begin(UUID.randomUUID(), new Object());
                  assertEquals(2, registry.drain().size());
                  assertEquals(0, registry.size());
                  assertTrue(registry.drain().isEmpty());
              }
          }
          EOF

