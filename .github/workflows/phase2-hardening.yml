          # PlexonShops 3.0.0 Runtime Certification

          Source/CI success does not authorize stable publication. Complete this checklist on PlexonCraft using the exact RC asset.

          - [ ] representative v2.2.1 database/config migration and rollback backup
          - [ ] discovery hub, browse, profile and closed/unavailable presentation
          - [ ] categories/search/favorites/recent/featured behavior
          - [ ] owner create/configure/open/manage/update/delete-confirmation flow
          - [ ] successful free and paid teleport
          - [ ] movement cancellation with no retained charge/visit
          - [ ] damage cancellation with no retained charge/visit
          - [ ] logout cancellation and cleanup
          - [ ] shop closure/destination invalidation during warmup
          - [ ] insufficient funds and Vault/Theosis provider failure behavior
          - [ ] refund on failed asynchronous teleport
          - [ ] exactly one charge and one visit for one successful request
          - [ ] duplicate/in-flight request rejection
          - [ ] restart persistence and recent/favorite reconstruction
          - [ ] invalid reload retains previous working runtime config
          - [ ] PlaceholderAPI offline/unloaded/deleted-shop behavior
          - [ ] public API/event ordering and committed-state timing
          - [ ] PlexonCore and cross-plugin integration
          - [ ] Spark/MSPT comparison against v2.2.1 under representative traffic
          - [ ] >=30-minute soak
          - [ ] zero HIGH/CRITICAL defects

          Stable `v3.0.0` remains unpublished and the Phase 2 PR remains draft/unmerged until every gate passes.
          EOF

