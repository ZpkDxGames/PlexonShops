name: Phase 2 Release Hardening

on:
  push:
    branches:
      - phase2/3.0.0-premium-discovery

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Apply audited correctness fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Patch anchor is not unique in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Reject unsupported future schemas before Hikari opens the database or schema metadata can be rewritten.
          replace_once(
              'src/main/java/com/plexon/shops/storage/SqliteShopRepository.java',
              '''                previousVersion = preflightSchemaVersion();\n                if (existingDatabase && previousVersion < SCHEMA_VERSION) {\n''',
              '''                previousVersion = preflightSchemaVersion();\n                if (previousVersion > SCHEMA_VERSION) {\n                    throw new StorageException(\n                            "Database schema v" + previousVersion + " is newer than supported v" + SCHEMA_VERSION\n                                    + "; refusing to start or rewrite schema metadata"\n                    );\n                }\n                if (existingDatabase && previousVersion < SCHEMA_VERSION) {\n'''
          )

          # Add a per-player in-flight transaction guard around charge -> teleportAsync -> visit commit.
          replace_once(
              'src/main/java/com/plexon/shops/services/TeleportService.java',
              '''    private final Map<UUID, PendingTeleport> pending = new ConcurrentHashMap<>();\n    private final Map<UUID, Long> cooldowns = new ConcurrentHashMap<>();\n''',
              '''    private final Map<UUID, PendingTeleport> pending = new ConcurrentHashMap<>();\n    private final Map<UUID, Long> cooldowns = new ConcurrentHashMap<>();\n    private final TeleportAttemptRegistry<InFlightTeleport> inFlight = new TeleportAttemptRegistry<>();\n'''
          )
          replace_once(
              'src/main/java/com/plexon/shops/services/TeleportService.java',
              '''    public int pendingCount() {\n        return pending.size();\n    }\n''',
              '''    public int pendingCount() {\n        return pending.size() + inFlight.size();\n    }\n\n    public int inFlightCount() {\n        return inFlight.size();\n    }\n'''
          )
