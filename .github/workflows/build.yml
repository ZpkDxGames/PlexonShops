name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify and package
        run: ./gradlew --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace
      - name: Verify candidate contract
        id: release_contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')
          test "$VERSION" = "3.0.0-rc.1"
          jar_path="build/libs/PlexonShops-${VERSION}.jar"
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/shops/api/PlexonShopsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/api/AvailabilityView.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/services/DiscoveryService.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/services/ShopAvailabilityResolver.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/event/PlexonShopCreatedEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/event/PlexonShopVisitedEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/event/PlexonShopRatedEvent.class' build/jar-contents.txt
          for prefix in 'com/zpkdxgames/plexoncore/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/'; do
            if grep -q "^${prefix}" build/jar-contents.txt; then
              echo "Forbidden compile-only dependency shaded into PlexonShops: ${prefix}" >&2
              exit 1
            fi
          done
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d " '\"\r" | grep -qx "${VERSION}"
          javap -verbose -classpath "${jar_path}" com.plexon.shops.PlexonShops | grep -q 'major version: 69'
          mkdir -p build/release
          (cd build/libs && sha256sum "PlexonShops-${VERSION}.jar" > ../release/SHA256SUMS.txt)
          (cd build/libs && sha256sum --check ../release/SHA256SUMS.txt)
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          with open('build/release/TEST_SUMMARY.txt', 'w', encoding='utf-8') as out:
              out.write(f"Tests: {totals['tests']} executed / {totals['failures']} failures / {totals['errors']} errors / {totals['skipped']} skipped\n")
          PY
          cat > build/release/PROVENANCE.txt <<EOF
          Repository: ZpkDxGames/PlexonShops
          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Java: 25
          Candidate: v${VERSION}
          EOF
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonShops-${{ steps.release_contract.outputs.version }}-${{ github.sha }}
          path: |
            build/libs/PlexonShops-${{ steps.release_contract.outputs.version }}.jar
            build/release/SHA256SUMS.txt
            build/release/TEST_SUMMARY.txt
            build/release/PROVENANCE.txt
          if-no-files-found: error
