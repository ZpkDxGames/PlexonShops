name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify and package
        run: ./gradlew --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Verify release contract
        id: release_contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p')
          jar_path="build/libs/PlexonShops-${VERSION}.jar"
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/shops/api/PlexonShopsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/event/PlexonShopCreatedEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/event/PlexonShopVisitedEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/shops/event/PlexonShopRatedEvent.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonShops' >&2
            exit 1
          fi
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx "${VERSION}"
          javap -verbose -classpath "${jar_path}" com.plexon.shops.PlexonShops \
            | grep -q 'major version: 69'
          mkdir -p build/release
          sha256sum "${jar_path}" > build/release/SHA256SUMS.txt
          sha256sum --check build/release/SHA256SUMS.txt
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whitespace
        run: git diff --check

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonShops-${{ steps.release_contract.outputs.version }}-${{ github.sha }}
          path: |
            build/libs/PlexonShops-${{ steps.release_contract.outputs.version }}.jar
            build/release/SHA256SUMS.txt
          if-no-files-found: error
