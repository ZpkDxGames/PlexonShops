name: Phase 2 Source Hardening

on:
  push:
    branches:
      - phase2/3.0.0-premium-discovery

permissions:
  contents: write

jobs:
  harden-source:
    if: ${{ !contains(github.event.head_commit.message, '[source-hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Apply audited source fixes and regression tests
        run: python3 .github/phase2-source-hardening.py
      - name: Verify patched candidate source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean test javadoc shadowJar verifyDistribution --no-daemon
          git diff --check
      - name: Commit verified source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 1
          fi
          git commit -m 'fix: close Phase 2 release blockers [source-hardened]'
          git push origin HEAD:phase2/3.0.0-premium-discovery
