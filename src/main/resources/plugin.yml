name: PlexonShops
version: '${version}'
main: com.plexon.shops.PlexonShops
description: GUI-first player shop directory for the Plexon ecosystem.
api-version: '26.2'
load: POSTWORLD
author: ZpkDxGames
website: https://github.com/ZpkDxGames/PlexonShops
softdepend:
  - PlexonCore
  - Vault
  - PlaceholderAPI

commands:
  pshops:
    description: Browse and manage Plexon player shops.
    usage: /<command> [manage|reload]
    aliases: [pshop, playershops]

permissions:
  plexonshops.use:
    description: Opens and uses the global player shops directory.
    default: true
  plexonshops.create:
    description: Creates and manages personal shops.
    default: false
  plexonshops.admin:
    description: Grants every PlexonShops administrative capability.
    default: op
    children:
      plexonshops.use: true
      plexonshops.create: true
      plexonshops.reload: true
      plexonshops.format: true
      plexonshops.teleport.cooldown.bypass: true
      plexonshops.teleport.fee.bypass: true
      plexonshops.subshops.unlimited: true
      plexonshops.limit.unlimited: true
  plexonshops.reload:
    description: Reloads PlexonShops configuration and language files.
    default: op
  plexonshops.format:
    description: Allows MiniMessage formatting in owned shop text.
    default: op
  plexonshops.limit.unlimited:
    description: Legacy alias that bypasses the per-player shop limit.
    default: false
  plexonshops.subshops.unlimited:
    description: Bypasses the per-player sub-shop limit.
    default: false
  plexonshops.teleport.cooldown.bypass:
    description: Bypasses the shop teleport cooldown.
    default: op
  plexonshops.teleport.fee.bypass:
    description: Bypasses all shop teleport fees.
    default: false
