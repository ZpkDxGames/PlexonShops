name: PlexonShops
version: '${version}'
main: com.plexon.shops.PlexonShops
api-version: '1.21'
authors: [ZpkDxGames]
description: Premium player-shop discovery, management, ratings and safe teleportation for PlexonCraft.
softdepend: [Vault, PlaceholderAPI, PlexonRanks, PlexonCore]

commands:
  pshops:
    description: Open PlexonShops discovery or management tools.
    usage: /<command> [discover|browse|manage|admin|diagnostics|reload]
    aliases: [pshop, playershops, shops]

permissions:
  plexonshops.use:
    description: Open the player shop discovery interface.
    default: true
  plexonshops.create:
    description: Create and manage owned shops.
    default: true
  plexonshops.admin:
    description: Open administration and operational diagnostics.
    default: op
  plexonshops.reload:
    description: Reload candidate configuration and messages transactionally.
    default: op
  plexonshops.format:
    description: Use supported formatting in player-authored shop text.
    default: op
  plexonshops.teleport.cooldown.bypass:
    description: Bypass shop teleport cooldowns.
    default: op
  plexonshops.teleport.fee.bypass:
    description: Bypass shop teleport fees.
    default: op
  plexonshops.limit.*:
    description: Legacy total-shop limit override namespace.
    default: false
  plexonshops.subshops.*:
    description: Additional sub-shop capacity override namespace.
    default: false
