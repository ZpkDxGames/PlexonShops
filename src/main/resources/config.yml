# PlexonShops 2.3.0
# Runtime database work is always executed away from the server thread.

database:
  file: "shops.db"
  maximum-pool-size: 2
  connection-timeout-millis: 5000

worker:
  threads: 2
  queue-capacity: 2048
  shutdown-timeout-seconds: 10

# PlexonCore event ownership is selected at plugin enable. Core 2.0.0 does not yet
# expose movement/damage/lifecycle subscriptions, so AUTO keeps those paths LOCAL.
core-runtime:
  mode: AUTO
  player-events:
    movement: true
    damage: true
    lifecycle: true
  fallback:
    allow-local-listeners: true
  diagnostics:
    track-fallbacks: true

limits:
  # This includes the player's primary shop. Additional shops are sub-shops.
  max-shops-per-player: 1
  # Preferred overrides use plexonshops.subshops.<number> (additional shops).
  # Legacy plexonshops.limit.<number> nodes (total shops) remain supported.
  maximum-permission-limit: 100
  max-categories-per-shop: 3
  max-labeled-items-per-shop: 45
  shop-name-length: 40
  description-lines: 5
  description-line-length: 80
  label-length: 48

defaults:
  status: CLOSED
  category: MISC
  teleport-fee: 25.0
  description:
    - "<gray>A new player shop in the <gradient:#8CE6FF:#5BA8FF>Plexon</gradient> directory.</gray>"

teleport:
  enabled: true
  warmup-seconds: 3
  cancel-on-movement: true
  cancel-on-damage: true
  cooldown-seconds: 10
  owners-bypass-cooldown: true
  economy-enabled: true
  fail-open-without-vault: false
  owners-can-set-fee: true
  owners-bypass-fee: true
  maximum-owner-fee: 5000.0
  bossbar:
    enabled: true
    color: BLUE
    overlay: PROGRESS
    update-interval-ticks: 2
  effects:
    enabled: true
    warmup-sound: "minecraft:block.beacon.power_select"
    arrival-sound: "minecraft:entity.enderman.teleport"
    volume: 0.8
    warmup-pitch: 1.25
    arrival-pitch: 1.0
    portal-particles: 32

inactivity-purge-days: 45
blacklisted-worlds:
  - "world_nether"
  - "world_the_end"

chat-prompts:
  cancel-word: "cancel"
  timeout-seconds: 60

